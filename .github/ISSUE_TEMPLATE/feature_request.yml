name: ✨ 功能建议 / Feature request
description: 提议一个新功能或改进 / Propose a new feature or improvement
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        本项目是 Codex CLI 的 Web 前端，**功能边界由上游 app-server 协议决定**：
        Codex 没有提供对应原语的能力，本项目不会在客户端自行模拟。
        提议前可以先翻一下 [`docs/upstream/`](https://github.com/LimLLL/codex-webui/tree/main/docs/upstream) 里的协议文档。

        This project is a web frontend for the Codex CLI, so **its feature surface is bounded by the upstream
        app-server protocol**: capabilities Codex does not expose as a primitive will not be simulated client-side.
        Skim [`docs/upstream/`](https://github.com/LimLLL/codex-webui/tree/main/docs/upstream) before proposing.

  - type: checkboxes
    id: preflight
    attributes:
      label: 预检 / Pre-flight checks
      options:
        - label: 我搜索过现有 issue，确认没有重复 / I searched existing issues and found no duplicate
          required: true
        - label: 这是 WebUI 层面的需求，不是对 Codex CLI 本身能力的需求 / This is a WebUI-level request, not a request for new Codex CLI capabilities
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 描述你遇到的实际场景和当前的痛点，而不是直接描述方案 / Describe the actual situation and pain point, not the solution
      placeholder: 我在……的时候，不得不…… / When I ..., I have to ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法 / Proposed solution
      description: 交互长什么样、入口在哪 / What the interaction looks like and where it lives
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives considered
      description: 现在有没有绕过去的办法？为什么不够用 / Any current workaround, and why it is not enough

  - type: dropdown
    id: area
    attributes:
      label: 涉及区域 / Affected area
      description: 可多选 / Multiple choices allowed
      multiple: true
      options:
        - 对话与线程 / Chat & threads
        - 消息分支与分支图 / Message branches & branch graph
        - 审批流程 / Approvals
        - 文件管理与预览 / File browser & viewers
        - 终端 / Terminal
        - 集成：插件 / MCP / Apps — Integrations
        - 设置与账号 / Settings & account
        - 认证与登录 / Auth & login
        - 部署：Docker / 反向代理 — Deployment
        - 国际化与无障碍 / i18n & accessibility
        - 其它 / Other

  - type: checkboxes
    id: contribution
    attributes:
      label: 参与意愿 / Contribution
      options:
        - label: 如果方案被接受，我愿意提 PR 实现 / I am willing to open a PR if the proposal is accepted
          required: false
